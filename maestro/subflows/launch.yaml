# Launch the staging app keeping the logged-in session, then wait for home.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: false
    stopApp: true
- runFlow:
    when:
      visible:
        id: "INPUT_PIN_VIEW"
    file: enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: ".*/HOME_SCENE-BUTTON-TAB_HOME"
    timeout: 60000
