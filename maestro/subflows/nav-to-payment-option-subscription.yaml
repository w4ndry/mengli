# Deeplink flip://subscriptions -> Super Flip "Langganan" page -> Beli Paket -> Generic Payment Page (PaymentOptionScene).
# Optional env PLAN (Starter|Standard|Ultra) picks the plan card by text before buying; default = preselected plan.
appId: ${APP_ID}
---
- runFlow: /Users/FLP9EriWandri/.claude/mengli/maestro/subflows/launch.yaml
- openLink: "flip://subscriptions"
- extendedWaitUntil:
    visible: "Beli Paket"
    timeout: 60000
- runFlow:
    when:
      true: ${PLAN != undefined && PLAN != ''}
    commands:
      - tapOn: ${PLAN}
- tapOn: "Beli Paket"
- extendedWaitUntil:
    visible:
      id: ".*/PAYMENT_OPTION_SCENE-PRODUCT_SUMMARY-BUTTON"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: ".*/PAYMENT_COMPONENT-BUTTON-PAYMENT_METHOD_ITEM-BUTTON-flip-coin"
    timeout: 30000
- assertVisible:
    id: ".*/PAYMENT_COMPONENT-FOOTER_CONTENT_TEXT_AMOUNT"
